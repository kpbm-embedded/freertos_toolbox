name        = "qemu-cli"
sdk         = "freertos"
description = "FreeRTOS+CLI: registered commands (echo, add, tasks, heap, uptime) run from a self-test script; -DCLI_INTERACTIVE=ON for a UART shell"
targets     = ["mps2-an385"]
hardware    = "none: qemu-system-arm -M mps2-an385 (Cortex-M3), console on UART0, exit code via semihosting"
features    = ["freertos", "cli", "freertos-plus", "qemu"]
status      = "tested on qemu (scripts/app examples test); not run on a board"
