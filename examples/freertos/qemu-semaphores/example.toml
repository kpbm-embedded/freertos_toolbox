name        = "qemu-semaphores"
sdk         = "freertos"
description = "Binary semaphore given by a timer interrupt (ISR to task) and a counting semaphore guarding a pool of 3 resources"
targets     = ["mps2-an385"]
hardware    = "none: qemu-system-arm -M mps2-an385 (Cortex-M3), console on UART0, exit code via semihosting"
features    = ["freertos", "semaphore", "isr", "qemu"]
status      = "tested on qemu (scripts/app examples test); not run on a board"
