name        = "qemu-zig-task"
sdk         = "freertos"
description = "A FreeRTOS task written in Zig (via C shims for the kernel macros), statistics over a queue, checked against C"
targets     = ["mps2-an385"]
hardware    = "none: qemu-system-arm -M mps2-an385; needs 32_24_microzig (microzig-box), skipped (exit 3) without it"
features    = ["freertos", "zig", "ffi", "qemu"]
status      = "tested on qemu (scripts/app examples test); not run on a board"
