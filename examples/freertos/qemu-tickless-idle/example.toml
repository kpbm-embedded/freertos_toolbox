name        = "qemu-tickless-idle"
sdk         = "freertos"
description = "Tickless idle: the kernel stops SysTick while all tasks block; far fewer tick interrupts than ticks, time stays right"
targets     = ["mps2-an385"]
hardware    = "none: qemu-system-arm -M mps2-an385 (Cortex-M3), console on UART0, exit code via semihosting"
features    = ["freertos", "tickless", "low-power", "qemu"]
status      = "tested on qemu (scripts/app examples test); not run on a board"
